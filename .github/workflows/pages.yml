name: Browserfassung veroeffentlichen

# Baut die Browserfassung und stellt sie auf GitHub Pages (https://phioster.github.io/akahana/).
# Mit ?probe hinter der Adresse laeuft der Mess-Rundgang und zeigt seine Werte unten im Bild.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Godot und Export-Vorlagen holen
        run: |
          wget -q "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          wget -q "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mv templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
      - name: Exportieren
        run: |
          godot --headless --import --quit-after 2000 || true
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html
          cp tools/web/probe.js tools/web/audio.js build/web/
          sed -i 's|<head>|<head><script src="audio.js"></script><script src="probe.js"></script>|' build/web/index.html
          touch build/web/.nojekyll
          ls -la build/web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
