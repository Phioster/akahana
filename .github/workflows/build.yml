name: APK bauen

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Ohne packages: '' versucht die Aktion, ihr Vorgabepaket "tools"
      # nachzuinstallieren -- ein Legacy-Paket, das Google inzwischen aus dem
      # Repository entfernt hat, woran sie sonst abbricht. Das SDK selbst
      # (cmdline-tools, PATH, ANDROID_HOME) richtet sie trotzdem ein.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Android-Werkzeuge einrichten
        run: |
          sdkmanager --install "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmdline-tools;latest"

      - name: Godot und Export-Vorlagen holen
        run: |
          wget -q "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot

          wget -q "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mv templates "~/.local/share/godot/export_templates/${GODOT_VERSION}.stable" || \
            mv templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      # Die CI signiert NUR mit einem Wegwerf-Schluessel. Der echte
      # Signaturschluessel verlaesst das Geraet des Entwicklers nicht -- die
      # fertige APK wird lokal mit tools/sign.sh nachsigniert.
      - name: Wegwerf-Schluessel erzeugen
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore signing.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

      - name: Exportieren
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/signing.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          godot --headless --import --quit-after 2000 || true
          mkdir -p build
          godot --headless --export-debug "Android" build/mohnweg-debug.apk
          ls -la build/

      # the APK goes to one rolling pre-release "dev" (replaced each build): release files do not count against
      # the Actions storage, which ran full on 2026-11-08 and then blocked every upload for hours
      - name: APK ans Release "dev" haengen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dev >/dev/null 2>&1 || gh release create dev --prerelease --title "Entwicklungs-Build" --notes "Immer der letzte Build, wird ersetzt."
          gh release upload dev build/mohnweg-debug.apk --clobber
